name: Release

# Publishing is OPT-IN.
#
# A tag (`vX.Y.Z`) always runs the version check and, for npm, the full
# test/build. Actual publishing only happens when explicitly enabled:
#
#   PyPI  -> repo variable  PUBLISH_PYPI = true
#            (needs either a PyPI trusted publisher, or a PYPI_TOKEN secret)
#   npm   -> repo variable  PUBLISH_NPM  = true
#            (needs either npm trusted publishing, or an NPM_TOKEN secret)
#
# With the variables unset, tag runs stay green and only validate.
#
# Enable with:
#   gh variable set PUBLISH_PYPI --repo restuhaqza/deepagents-sbx --body true
#   gh variable set PUBLISH_NPM  --repo restuhaqza/deepagents-sbx --body true

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for PyPI trusted publishing and npm provenance (OIDC).
  id-token: write

jobs:
  verify-version:
    name: Verify tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check versions line up
        # The tag is authoritative: every version source must agree with it and
        # with each other. `uv.lock` and the runtime constants are easy to
        # forget (a stale `__version__` ships silently), so they are checked too.
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"

          py=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          py_runtime=$(grep -m1 '^__version__ = ' python/src/deepagents_sbx/__init__.py | cut -d'"' -f2)
          py_lock=$(awk '/^name = "deepagents-sbx"$/{f=1} f && /^version = /{print; exit}' python/uv.lock | cut -d'"' -f2)
          js=$(node -p "require('./js/package.json').version")
          js_runtime=$(grep -m1 '^export const VERSION = ' js/src/index.ts | cut -d'"' -f2)
          js_lock=$(node -p "require('./js/package-lock.json').version")

          echo "tag=$tag"
          echo "  python/pyproject.toml           = $py"
          echo "  python __version__              = $py_runtime"
          echo "  python/uv.lock                  = $py_lock"
          echo "  js/package.json                 = $js"
          echo "  js VERSION                      = $js_runtime"
          echo "  js/package-lock.json            = $js_lock"

          fail=0
          check() {
            if [ "$2" != "$tag" ]; then
              echo "::error::$1 is $2, expected $tag (run 'uv lock' / 'npm install' after bumping)"
              fail=1
            fi
          }
          check "python/pyproject.toml" "$py"
          check "python __version__" "$py_runtime"
          check "python/uv.lock" "$py_lock"
          check "js/package.json" "$js"
          check "js VERSION" "$js_runtime"
          check "js/package-lock.json" "$js_lock"
          exit "$fail"

  python:
    name: Publish to PyPI
    needs: verify-version
    # Opt-in: skipped (neutral) until PUBLISH_PYPI is set to "true".
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deepagents-sbx
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel + sdist
        working-directory: python
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # Re-running a tag (e.g. after a retry) must not fail on existing files.
          skip-existing: true
          # Optional escape hatch: set a PYPI_TOKEN repo secret to authenticate
          # with an API token. When the secret is empty the action falls back to
          # trusted publishing (OIDC).
          password: ${{ secrets.PYPI_TOKEN }}

  npm:
    name: Publish to npm
    needs: verify-version
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/deepagents-sbx
    permissions:
      id-token: write
      contents: read
    env:
      # Optional. Leave unset to use npm trusted publishing (OIDC).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure npm auth (only when NPM_TOKEN is set)
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
      - name: Is this version already on npm?
        id: exists
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "deepagents-sbx@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::deepagents-sbx@${version} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.exists.outputs.published != 'true' && (vars.PUBLISH_NPM == 'true' || env.NPM_TOKEN != '')
        # `--provenance` signs the attestation with the OIDC token. Auth is
        # either NPM_TOKEN (when set) or npm trusted publishing.
        run: npm publish --access public --provenance
      - name: Publishing not enabled
        if: steps.exists.outputs.published != 'true' && vars.PUBLISH_NPM != 'true' && env.NPM_TOKEN == ''
        run: |
          echo "::notice::deepagents-sbx@$(node -p "require('./package.json').version") is not on npm yet, but publishing is disabled."
          echo "Set the repo variable PUBLISH_NPM=true (plus npm trusted publishing or the NPM_TOKEN secret) to enable it."

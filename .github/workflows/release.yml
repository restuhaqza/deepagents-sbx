name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for PyPI trusted publishing and npm provenance (OIDC).
  id-token: write

jobs:
  verify-version:
    name: Verify tag matches package versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions line up
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)
          js=$(node -p "require('./js/package.json').version")
          echo "tag=$tag python=$py js=$js"
          test "$tag" = "$py" || { echo "::error::tag $tag != python version $py"; exit 1; }
          test "$tag" = "$js" || { echo "::error::tag $tag != npm version $js"; exit 1; }

  python:
    name: Publish to PyPI
    needs: verify-version
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/deepagents-sbx
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build wheel + sdist
        working-directory: python
        run: uv build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          # Re-running a tag (e.g. after a retry) must not fail on existing files.
          skip-existing: true
          # Optional escape hatch: set a PYPI_TOKEN repo secret to authenticate
          # with an API token. When the secret is empty the action falls back to
          # trusted publishing (OIDC).
          password: ${{ secrets.PYPI_TOKEN }}

  npm:
    name: Publish to npm
    needs: verify-version
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/deepagents-sbx
    permissions:
      id-token: write
      contents: read
    env:
      # Optional. Leave unset to use npm trusted publishing (OIDC).
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Configure npm auth (only when NPM_TOKEN is set)
        if: env.NPM_TOKEN != ''
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
      - name: Is this version already on npm?
        id: exists
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "deepagents-sbx@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::deepagents-sbx@${version} is already published; skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.exists.outputs.published != 'true'
        # `--provenance` signs the attestation with the OIDC token. Auth is
        # either NPM_TOKEN (when set) or npm trusted publishing.
        run: npm publish --access public --provenance
